<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Showcase</title>
</head>
<body>

    <header>
        <h1>Media Showcase</h1>
        <p>Images, Audio, Video, YouTube, Google Map, and PDF</p>
    </header>

    <main>

        <section>
            <h2>Image Gallery</h2>
            <img src="../../../FIFA-WEB/images/alnpotm.jpeg" alt="Mountain View" width="250" height="180">
            <img src="../../../FIFA-WEB/wallpapers/pc9.jpg" alt="Beach View" width="250" height="180">
            <img src="../../../FIFA-WEB/images/uefanl.jpeg" alt="Forest View" width="250" height="180">
        </section>

        <section>
            <h2>Audio Player</h2>
            <audio controls>
                <source src="audio1.mpeg" type="audio/mpeg">
                <source src="audio.ogg" type="audio/ogg">
                Your browser does not support the audio element.
            </audio>
        </section>

        <section>
            <h2>Video Player</h2>
            <video width="600" controls poster="poster.jpg">
                <source src="../../../FIFA-WEB/videos/about.mp4" type="video/mp4">
                <source src="video.webm" type="video/webm">
                Your browser does not support the video tag.
            </video>
        </section>

        <section>
            <h2>YouTube Video</h2>
            <iframe width="560" height="315"
                src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                title="YouTube Video"
                allowfullscreen>
            </iframe>
        </section>

        <section>
            <h2>Google Map</h2>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3916.217266632502!2d76.95583231480367!3d11.016844992156073!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ba859bfb8f7d3d7%3A0x6b2b4ef5d3c4e6d1!2sCoimbatore!5e0!3m2!1sen!2sin!4v1690000000000"
                width="600"
                height="450"
                style="border:0;"
                loading="lazy"
                allowfullscreen>
            </iframe>
        </section>

        <section>
            <h2>Embedded PDF</h2>
            <iframe src="dhakshesh b  Main Project .pdf" width="600" height="500">
                Your browser does not support PDF viewing.
            </iframe>
        </section>

    </main>

</body>
</html>
