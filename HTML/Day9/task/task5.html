<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Registration & Inventory Report</title>
</head>
<body>

    <h2>Electronics Shop Inventory System</h2>

    <form>

        <label for="productid">Product ID:</label><br>
        <input type="text" id="productid" name="productid" placeholder="Enter Product ID" required><br><br>

        <label for="productname">Product Name:</label><br>
        <input type="text" id="productname" name="productname" placeholder="Enter Product Name" required><br><br>

        <label for="brand">Brand:</label><br>
        <input type="text" id="brand" name="brand" placeholder="Enter Brand Name" required><br><br>

        <label for="category">Category:</label><br>
        <select id="category" name="category">
            <option value="">--Select Category--</option>
            <option>Mobile</option>
            <option>Laptop</option>
            <option>Tablet</option>
            <option>Smart Watch</option>
            <option>Accessories</option>
        </select>
        <br><br>

        <label for="price">Price:</label><br>
        <input type="number" id="price" name="price" placeholder="Enter Price" required><br><br>

        <label for="quantity">Quantity:</label><br>
        <input type="number" id="quantity" name="quantity" placeholder="Enter Quantity" required><br><br>

        <label for="supplier">Supplier:</label><br>
        <input type="text" id="supplier" name="supplier" placeholder="Enter Supplier Name" required><br><br>

        <label for="image">Product Image:</label><br>
        <input type="file" id="image" name="image"><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

    <hr>

    <h2>Inventory Report</h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Brand</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Stock Status</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>P101</td>
                <td>Galaxy S24</td>
                <td>Samsung</td>
                <td>₹75,000</td>
                <td>20</td>
                <td>In Stock</td>
            </tr>

            <tr>
                <td>P102</td>
                <td>iPhone 16</td>
                <td>Apple</td>
                <td>₹89,900</td>
                <td>10</td>
                <td>Limited Stock</td>
            </tr>

            <tr>
                <td>P103</td>
                <td>Inspiron 15</td>
                <td>Dell</td>
                <td>₹62,500</td>
                <td>0</td>
                <td>Out of Stock</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
