<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Patient Registration</title>
</head>
<body>

    <h2>Apollo Hospital Patient Registration</h2>

    <form>

        <label for="patientid">Patient ID:</label><br>
        <input type="text" id="patientid" name="patientid" placeholder="Enter Patient ID" required><br><br>

        <label for="patientname">Patient Name:</label><br>
        <input type="text" id="patientname" name="patientname" placeholder="Enter Patient Name" required><br><br>

        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" min="1" max="120" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>

        <label for="bloodgroup">Blood Group:</label><br>
        <select id="bloodgroup" name="bloodgroup">
            <option value="">--Select Blood Group--</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>
        <br><br>

        <label for="doctor">Doctor:</label><br>
        <select id="doctor" name="doctor">
            <option value="">--Select Doctor--</option>
            <option>Dr. Kumar</option>
            <option>Dr. Priya</option>
            <option>Dr. Arun</option>
            <option>Dr. Meena</option>
        </select>
        <br><br>

        <label for="appointment">Appointment Date:</label><br>
        <input type="date" id="appointment" name="appointment"><br><br>

        <label for="symptoms">Symptoms:</label><br>
        <textarea id="symptoms" name="symptoms" rows="4" cols="40" placeholder="Enter Symptoms"></textarea>
        <br><br>

        <label for="report">Medical Report Upload:</label><br>
        <input type="file" id="report" name="report"><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

    <hr>

    <h2>Patient Details</h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Patient ID</th>
                <th>Patient Name</th>
                <th>Doctor</th>
                <th>Blood Group</th>
                <th>Appointment Date</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>P001</td>
                <td>Rahul Kumar</td>
                <td>Dr. Kumar</td>
                <td>O+</td>
                <td>10-08-2026</td>
                <td>Confirmed</td>
            </tr>

            <tr>
                <td>P002</td>
                <td>Priya Sharma</td>
                <td>Dr. Priya</td>
                <td>A+</td>
                <td>11-08-2026</td>
                <td>Pending</td>
            </tr>

            <tr>
                <td>P003</td>
                <td>Arun Kumar</td>
                <td>Dr. Meena</td>
                <td>B+</td>
                <td>12-08-2026</td>
                <td>Completed</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
