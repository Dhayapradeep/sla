<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <center>
    <h1>GOOGLE REGISTRATION FORM</h1>
    </center>
    <form action="">
        <label for="name">Name</label>
        <input type="text" placeholder="Enter your name" id="name" required><br>
        <br>
        <label for="age">Age</label>
        <input type="number" placeholder="Enter a valid age" id="age" required><br>
        <br>
        <label for="mobile">Mobile Number</label>
        <input type="tel" placeholder="Enter a valid mobile number" id="mobile" required minlength="10" maxlength="12"><br>
        <br>
        <label for="email">E-mail</label>
        <input type="email" placeholder="Enter a valid e-mail" id="email" required><br>
        <br>
        <label for="password">Password</label>
        <input type="password" placeholder="Enter password" id="password" required><br>
        <br>
        <label for="gender">Gender</label>
        <input type="radio" id="gender" name="Gender">Male
        <input type="radio" id="gender" name="Gender">Female <br>
        <br>
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob"><br>
        <br>
        <label>Course</label>
        <select>
            <option value="Select one">Select one</option>
            <option value="FS">FS</option>
            <option value="DS">DS</option>
            <option value="Ml">ML</option>
            <option value="DS">DS</option>
        </select>


    </form>
</body>
</html>
