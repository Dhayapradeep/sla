<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <h2>Job Application Form</h2>
    <p>Please fill in the details below to apply for the job.</p>

    <form action="#" method="post">

        <label for="fname">Full Name:</label><br>
        <input type="text"
               id="fname"
               name="fullname"
               placeholder="Enter your full name"
               required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email"
               id="email"
               name="email"
               placeholder="example@gmail.com"
               required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel"
               id="phone"
               name="phone"
               placeholder="9876543210"
               pattern="[0-9]{10}"
               required><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date"
               id="dob"
               name="dob"><br><br>

      
        <label>Gender:</label><br>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label><br><br>

       
        <label for="address">Address:</label><br>
        <textarea id="address"
                  name="address"
                  rows="4"
                  cols="40"
                  placeholder="Enter your address"></textarea><br><br>

        
        <label for="qualification">Highest Qualification:</label><br>
        <select id="qualification" name="qualification">
            <option value="">--Select Qualification--</option>
            <option>High School</option>
            <option>Diploma</option>
            <option>Bachelor's Degree</option>
            <option>Master's Degree</option>
            <option>Ph.D</option>
        </select><br><br>

        
        <label>Skills:</label><br>

        <input type="checkbox" id="html" name="skill" value="HTML">
        <label for="html">HTML</label><br>

        <input type="checkbox" id="css" name="skill" value="CSS">
        <label for="css">CSS</label><br>

        <input type="checkbox" id="js" name="skill" value="JavaScript">
        <label for="js">JavaScript</label><br>

        <input type="checkbox" id="python" name="skill" value="Python">
        <label for="python">Python</label><br><br>

     
        <label for="experience">Years of Experience:</label><br>
        <input type="number"
               id="experience"
               name="experience"
               min="0"
               max="40"><br><br>

      
        <label for="position">Applying For:</label><br>
        <select id="position" name="position">
            <option value="">--Select Position--</option>
            <option>Software Developer</option>
            <option>Web Designer</option>
            <option>Data Analyst</option>
            <option>System Administrator</option>
        </select><br><br>

        
        <label for="resume">Upload Resume:</label><br>
        <input type="file"
               id="resume"
               name="resume"
               required><br><br>

        
        <label for="cover">Cover Letter:</label><br>
        <textarea id="cover"
                  name="coverletter"
                  rows="6"
                  cols="40"
                  placeholder="Write a short cover letter"></textarea><br><br>

        <input type="checkbox"
               id="declaration"
               name="declaration"
               required>
        <label for="declaration">
            I declare that the above information is true.
        </label><br><br>

        
        <input type="submit" value="Apply Now">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
