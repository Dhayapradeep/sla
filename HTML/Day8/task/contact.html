<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>

    <h2>Contact Us</h2>
    <p>Please fill out the form below. We will get back to you soon.</p>

    <form action="#" method="post">

        
        <label for="name">Full Name:</label><br>
        <input type="text"
               id="name"
               name="fullname"
               placeholder="Enter your full name"
               required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email"
               id="email"
               name="email"
               placeholder="example@gmail.com"
               required><br><br>

        
        <label for="phone">Phone Number:</label><br>
        <input type="tel"
               id="phone"
               name="phone"
               placeholder="9876543210"
               pattern="[0-9]{10}"><br><br>

        
        <label for="subject">Subject:</label><br>
        <input type="text"
               id="subject"
               name="subject"
               placeholder="Enter subject" required><br><br>

        
        <label for="department">Department:</label><br>
        <select id="department" name="department">
            <option value="">--Select Department--</option>
            <option>Sales</option>
            <option>Support</option>
            <option>Technical</option>
            <option>Feedback</option>
        </select><br><br>

        
        <label>Preferred Contact Method:</label><br>

        <input type="radio" id="emailContact" name="contact" value="Email">
        <label for="emailContact">Email</label>

        <input type="radio" id="phoneContact" name="contact" value="Phone">
        <label for="phoneContact">Phone</label><br><br>

        
        <label>Services Interested In:</label><br>

        <input type="checkbox" id="web" name="service" value="Web Development">
        <label for="web">Web Development</label><br>

        <input type="checkbox" id="app" name="service" value="App Development">
        <label for="app">App Development</label><br>

        <input type="checkbox" id="design" name="service" value="UI/UX Design">
        <label for="design">UI/UX Design</label><br><br>

        
        <label for="message">Your Message:</label><br>
        <textarea id="message" name="message" rows="6" cols="40" placeholder="Type your message here..." required></textarea><br><br>
  

        <input type="checkbox" id="agree" name="agree" required>
        <label for="agree">
            I confirm that the information provided is correct.
        </label><br><br>

    
        <input type="submit" value="Send Message">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
