<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Column Layout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="container">
        <div class="row">

            <div class="col-6 p-4 bg-primary text-white">
                <h2>Left Section</h2>
                <p>
                    This is the left section of the webpage.
                    Bootstrap makes it easy to create columns.
                </p>
            </div>

            <div class="col-6 p-4 bg-warning">
                <h2>Right Section</h2>
                <p>
                    This is the right section of the webpage.
                    Both sections have equal width.
                </p>
            </div>

        </div>
    </div>

</body>
</html>
