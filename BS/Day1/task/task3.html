<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Columns</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="container">
        <div class="row">

            <div class="col-3 p-4 bg-primary text-white">
                <h3>Box 1</h3>
                <p>First box</p>
            </div>

            <div class="col-3 p-4 bg-success text-white">
                <h3>Box 2</h3>
                <p>Second box</p>
            </div>

            <div class="col-3 p-4 bg-warning">
                <h3>Box 3</h3>
                <p>Third box</p>
            </div>

            <div class="col-3 p-4 bg-danger text-white">
                <h3>Box 4</h3>
                <p>Fourth box</p>
            </div>

        </div>
    </div>

</body>
</html>
