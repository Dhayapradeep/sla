<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display None vs Visibility Hidden</title>
  <link rel="stylesheet" href="assets/css/task4.css">
</head>

<body>

  <h1>CSS Visibility Example</h1>

  <div class="container">

    <div class="box normal">
      Normal Box
    </div>

    <div class="box display-none">
      Display None
    </div>

    <div class="box visibility-hidden">
      Visibility Hidden
    </div>

    <div class="box normal">
      Normal Box
    </div>

  </div>

</body>
</html>
