<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hide Cards</title>
  <link rel="stylesheet" href="assets/css/task5.css">
</head>

<body>

  <div class="container">

    <div class="card">
      <h2>Card 1</h2>
      <p>This card is visible.</p>
    </div>

    <div class="card display-none">
      <h2>Card 2</h2>
      <p>This card uses display: none.</p>
    </div>

    <div class="card visibility-hidden">
      <h2>Card 3</h2>
      <p>This card uses visibility: hidden.</p>
    </div>

    <div class="card">
      <h2>Card 4</h2>
      <p>This card is visible.</p>
    </div>

  </div>

</body>
</html>
