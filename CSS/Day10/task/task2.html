<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Cards</title>
    <link rel="stylesheet" href="assets/css/task2.css">
</head>
<body>

    <h1>Products</h1>

    <div class="products">

        <div class="card">
            <img src="../../../../../FIFA-WEB/images/cwcgb.jpeg" alt="Laptop">
            <h2>golden ball</h2>
            <p>₹50,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="../../../../../FIFA-WEB/images/uefacl.jpeg" alt="Smartphone">
            <h2>cl trophy</h2>
            <p>₹25,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="../../../../../FIFA-WEB/images/spl.jpg" alt="Headphones">
            <h2>spl trophy</h2>
            <p>₹2,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="../../../../../FIFA-WEB/images/bfmp.jpeg" alt="Smart Watch">
            <h2>best player award</h2>
            <p>₹3,500</p>
            <button>Buy Now</button>
        </div>

</body>
</html>
