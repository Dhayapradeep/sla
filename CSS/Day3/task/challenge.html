<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model Demonstration</title>
    <link rel="stylesheet" href="assets/css/challenge.css">
</head>
<body>

<h1>CSS Box Model Demonstration</h1>

<!-- Student Card -->
<div class="card student">
    <img src="../../../../../FIFA-WEB/images/ronaldo.jpg" alt="Student">
    <h2>Student Card</h2>
    <p>Name: Ronaldo Sharma</p>
    <p>Course: B.Tech</p>
</div>

<!-- Employee Card -->
<div class="card employee">
    <img src="../../../../../FIFA-WEB/images/ronaldo.jpg" alt="Employee">
    <h2>Employee Card</h2>
    <p>Name: krishna Ronaldo</p>
    <p>ID: EMP101</p>
</div>

<!-- Product Card -->
<div class="card product">
    <img src="../../../../../FIFA-WEB/images/coke.jpeg" alt="Product">
    <h2>Product Card</h2>
    <p>Coke</p>
    <p>Price: $99</p>
</div>

<!-- Movie Card -->
<div class="card movie">
    <img src="../../../../../FIFA-WEB/images/stadium.jpeg" alt="Movie">
    <h2>Movie Card</h2>
    <p>Movie: Ronaldo boiography/p>
    <p>Genre: Sports</p>
</div>

<!-- Company Card -->
<div class="card company">
    <img src="../../../HTML/Day6/task/college.jpg" alt="Company">
    <h2>Company Card</h2>
    <p>ABC Technologies</p>
    <p>Location: New York</p>
</div>

</html>
