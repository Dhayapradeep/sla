<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Colored Boxes</title>

    <style>
        .box {
            width: 300px;
            height: 100px;
            text-align: center;
            color: white;
            margin: 10px auto;
        }

        .box1 {
            background-color: red;
        }

        .box2 {
            background-color: blue;
        }

        .box3 {
            background-color: green;
        }

        .box4 {
            background-color: orange;
        }

        .box5 {
            background-color: purple;
        }
    </style>
</head>
<body>

    <div class="box box1">
        <h2>CSS</h2>
        <p>This is the first colored box.</p>
    </div>

    <div class="box box2">
        <h2>Box 2</h2>
        <p>This is the second colored box.</p>
    </div>

    <div class="box box3">
        <h2>Box 3</h2>
        <p>This is the third colored box.</p>
    </div>

    <div class="box box4">
        <h2>Box 4</h2>
        <p>This is the fourth colored box.</p>
    </div>

    <div class="box box5">
        <h2>Box 5</h2>
        <p>This is the fifth colored box.</p>
    </div>

</body>
</html>
