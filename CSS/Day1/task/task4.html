<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Department Page</title>

    <style>
        .department {
            width: 300px;
            height: 60px;
            text-align: center;
            color: white;
            line-height: 60px;
            margin: 10px auto;
            font-size: 20px;
            font-weight: bold;
        }

        .cse {
            background-color: blue;
        }

        .it {
            background-color: green;
        }

        .ece {
            background-color: orange;
        }

        .eee {
            background-color: purple;
        }

        .mechanical {
            background-color: brown;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center;">Engineering Departments</h1>

    <div class="department cse">CSE</div>
    <div class="department it">IT</div>
    <div class="department ece">ECE</div>
    <div class="department eee">EEE</div>
    <div class="department mechanical">Mechanical</div>

</body>
</html>
