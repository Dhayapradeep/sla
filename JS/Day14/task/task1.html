<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Hide</title>
    <style>
        .hide {
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: 0.5s;
}

.show {
    opacity: 1;
    max-height: 100px;
    transition: 0.5s;
}
    </style>
</head>
<body>
    <p id="text" class="hide">This is a hidden paragraph.</p>
    <button id="toggleBtn">Show / Hide</button>
</body>
<script src="task1.js"></script>
</html>
